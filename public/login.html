<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar — Feria La Camelia</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Zilla+Slab:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-logo">
      <span class="logo-icon" style="font-size:2.5rem;display:block;text-align:center">🌸</span>
      <div style="text-align:center;margin-top:.25rem">
        <div style="font-family:'Inter',sans-serif;font-size:.65rem;font-weight:800;letter-spacing:.28em;text-transform:uppercase;color:#7B4F2E">Feria</div>
        <div style="font-family:'Zilla Slab','Georgia',serif;font-size:1.3rem;font-weight:600">la <span style="color:#7B4F2E">Ca</span><span style="color:#A89040">melia</span></div>
      </div>
    </div>
    <p class="login-title">Accedé con tu cuenta</p>

    <div id="login-error" class="login-error hidden"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="tu@email.com" autocomplete="email" required>
      </div>
      <div class="form-group" style="margin-bottom:1.5rem">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="login-btn">Ingresar</button>
    </form>

    <p style="text-align:center;margin-top:1.25rem;font-size:.875rem;color:var(--gray-500)">
      ¿No tenés cuenta? <a href="/registrar.html">Registrate gratis</a>
    </p>
    <p style="text-align:center;margin-top:.5rem;font-size:.8rem">
      <a href="/" style="color:var(--gray-400)">← Volver al inicio</a>
    </p>
  </div>

  <script src="/js/app.js"></script>
  <script>
    // Redirect if already logged in
    fetch('/api/feriantes/check').then(r => r.json()).then(d => {
      if (d.authenticated) window.location.href = '/mi-cuenta.html';
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errDiv = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');
      errDiv.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Ingresando…';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/feriantes/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/mi-cuenta.html';
        } else {
          errDiv.textContent = data.error || 'Email o contraseña incorrectos.';
          errDiv.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Ingresar';
        }
      } catch {
        errDiv.textContent = 'Error de conexión. Intentá nuevamente.';
        errDiv.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>
